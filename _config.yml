title: Hyein Kim
description: Personal site
markdown: kramdown

exclude:
  - .local-assets/abcd-logo
  - vendor
  - NOTES.md

collections:
  abcd:
    output: true
    permalink: /abcd/:name/
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: "abcd"
    values:
      layout: abcd_layout
  - scope:
      path: ""
      type: abcd
    values:
      layout: abcd_layout
  - scope:
      path: ""
      type: projects
    values:
      layout: project_layout
